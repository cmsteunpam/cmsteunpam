<style>
:root{--indigo:#2E3192;--blue:#1B6EC2;--gold:#F5B301;--ink:#26272B;--muted:#6B7280;--soft:#F5F7FC;--line:#E3E7F1}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:var(--ink);font-family:Inter,'Helvetica Neue',Arial,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:32px 20px 48px}
.head{text-align:center}
.pill{display:inline-block;background:var(--blue);color:#fff;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:8px 20px;border-radius:50px}
h1{margin:14px 0 8px;color:var(--blue);font-size:34px;font-weight:800;text-transform:uppercase}
.sub{color:var(--muted);max-width:680px;margin:0 auto;line-height:1.6;font-size:15px}
.bar{width:60px;height:4px;background:var(--gold);border-radius:4px;margin:16px auto 0}
.tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:26px 0 40px}
.tabs a{text-decoration:none;color:var(--indigo);border:1.5px solid var(--indigo);font-weight:700;font-size:13px;padding:9px 18px;border-radius:50px;transition:.2s}
.tabs a:hover{background:var(--indigo);color:#fff}
.sec{margin-bottom:44px;scroll-margin-top:12px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-left:4px solid var(--blue);padding-left:16px;margin-bottom:18px}
.eyebrow{color:#D99A00;font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}
.sec h2{margin:4px 0 6px;color:var(--indigo);font-size:22px;font-weight:800}
.sec p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.6;max-width:820px}
.nav{display:flex;gap:8px;flex-shrink:0}
.nav button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--indigo);background:#fff;color:var(--indigo);font-size:20px;line-height:1;cursor:pointer;transition:.2s}
.nav button:hover:not(:disabled){background:var(--indigo);color:#fff}
.nav button:disabled{opacity:.3;cursor:default}
.track{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;align-items:flex-start;padding:4px 2px 16px;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.card{flex:0 0 calc((100% - 60px)/4);scroll-snap-align:start;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 2px 8px rgba(46,49,146,.06)}
.photo{position:relative;aspect-ratio:4/5;background:linear-gradient(160deg,var(--indigo),var(--blue));display:flex;align-items:center;justify-content:center;color:#fff;font-size:44px;font-weight:800}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.body{padding:16px}
.name{margin:0 0 4px;font-size:15px;font-weight:800;color:var(--indigo);line-height:1.35}
.idn{font-size:12px;color:var(--muted);margin:0 0 10px}
.idn b{color:var(--ink)}
.jad{display:inline-block;background:#E8F1FB;color:var(--blue);font-size:11px;font-weight:700;padding:4px 10px;border-radius:6px}
.links{display:flex;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.links a{flex:1;text-align:center;text-decoration:none;font-size:11.5px;font-weight:700;color:var(--blue);border:1.5px solid var(--blue);border-radius:8px;padding:7px 4px;transition:.2s}
.links a:hover{background:var(--blue);color:#fff}
.links a.off{opacity:.35;pointer-events:none}
.edu-btn{display:flex;align-items:center;gap:6px;width:100%;margin-top:12px;padding:0;background:none;border:0;cursor:pointer;font:800 11px Inter,Arial,sans-serif;letter-spacing:.5px;text-transform:uppercase;color:var(--indigo)}
.edu-btn i{font-style:normal;color:var(--gold);transition:transform .2s}
.card.open .edu-btn i{transform:rotate(90deg)}
.edu{display:none;list-style:none;margin:10px 0 0;padding:0}
.card.open .edu{display:block}
.edu li{position:relative;padding:0 0 10px 18px;font-size:12px;color:#4B5160;line-height:1.4}
.edu li:before{content:"";position:absolute;left:0;top:4px;width:8px;height:8px;border-radius:50%;background:var(--indigo);border:2px solid var(--gold)}
.edu li:after{content:"";position:absolute;left:3px;top:14px;bottom:-4px;width:1px;background:var(--line)}
.edu li:last-child:after{display:none}
.edu b{display:block;color:var(--indigo);font-size:11px}
@media(max-width:960px){.card{flex-basis:calc((100% - 20px)/2)}}
@media(max-width:560px){.card{flex-basis:82%}h1{font-size:24px}.sec-head{flex-direction:column;align-items:flex-start}}
</style>
</head>

const initials = n => {
  const w = n.split(',')[0].replace(/^((Prof|Dr|Ir|Drs|Hj?)\.?\s*)+/i,'').trim().split(/\s+/);
  return ((w[0]||'')[0] + (w[1]||'')[0] || w[0][0]).toUpperCase();
};

      <h3 class="name">${esc(d.name)}</h3>

      <span class="jad">${esc(d.jad)}</span>

        <p>${esc(c.desc)}</p>
      </div>
      <div class="nav">
        <button type="button" class="prev" aria-label="Sebelumnya">&#8249;</button>
        <button type="button" class="next" aria-label="Berikutnya">&#8250;</button>
      </div>
    </div>
    <div class="track">${DOSEN.filter(d => d.cat === c.id).map(card).join('')}</div>
  </section>`).join('');

/* ========== SLIDER ========== */
document.querySelectorAll('.sec').forEach(s => {
  const t = s.querySelector('.track'), p = s.querySelector('.prev'), n = s.querySelector('.next');
  const upd = () => {
    p.disabled = t.scrollLeft <= 2;
    n.disabled = t.scrollLeft + t.clientWidth >= t.scrollWidth - 2;
  };
  p.onclick = () => t.scrollBy({left: -(t.clientWidth + 20), behavior: 'smooth'});
  n.onclick = () => t.scrollBy({left: t.clientWidth + 20, behavior: 'smooth'});
  t.addEventListener('scroll', upd);
  window.addEventListener('resize', upd);
  upd();
});

/* ========== RIWAYAT PENDIDIKAN ========== */
document.addEventListener('click', e => {
  const b = e.target.closest('.edu-btn');
  if (!b) return;
  const c = b.closest('.card');
  c.classList.toggle('open');
  b.setAttribute('aria-expanded', c.classList.contains('open'));
});
</script>
</body>
</html>
